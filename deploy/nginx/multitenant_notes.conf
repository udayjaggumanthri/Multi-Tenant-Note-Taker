# ==============================================================================
# Multi-Tenant Note Taker — Nginx Reverse Proxy Configuration
# ==============================================================================
# Place this file in: /etc/nginx/sites-available/multitenant_notes
# Symlink to: /etc/nginx/sites-enabled/multitenant_notes
#
# IMPORTANT:
# Replace "yourdomain.com" with your actual domain name or VPS IP.
# If you don't have a domain yet, you can test with IP or .localhost.
# ==============================================================================

# Upstream Django backend running via Gunicorn / PM2
upstream django_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;

    # Matches main domain, platform domain, and all tenant subdomains (*.yourdomain.com)
    server_name ~^(?<tenant>.+)\.yourdomain\.com$ yourdomain.com prod.yourdomain.com;

    # Maximum file upload size
    client_max_body_size 25M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --------------------------------------------------------------------------
    # 1. DJANGO STATIC ASSETS
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/multitenant-notes/backend/staticfiles/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # 2. DJANGO REST API & ADMIN REVERSE PROXY
    # --------------------------------------------------------------------------
    # Routes all /api/ and /admin/ endpoints directly to Django
    location ~ ^/(api|admin)/ {
        proxy_pass http://django_backend;

        # CRITICAL MULTI-TENANT CONFIGURATION:
        # Preserve original Host header so Django's TenantMiddleware can resolve the tenant!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Keep-alive support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 3. REACT FRONTEND (SINGLE PAGE APP)
    # --------------------------------------------------------------------------
    # Serves the compiled production React bundle for all tenant domains
    location / {
        root /var/www/multitenant-notes/frontend/dist;
        index index.html;

        # HTML5 pushState history routing:
        # If file is not found, fallback to index.html so React Router takes over
        try_files $uri $uri/ /index.html;
    }

    # Cache static frontend assets (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/multitenant-notes/frontend/dist;
        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800";
    }

    # Logging
    access_log /var/log/nginx/multitenant_notes_access.log;
    error_log /var/log/nginx/multitenant_notes_error.log;
}
